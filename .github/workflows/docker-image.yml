name: Docker Hub

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  repository_dispatch:
    types: ["solid-data-manager-released", "semantic-data-catalog-released", "solid-health-app-released", "city-tours-released", "solid-health-questionnaire-released"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: solid-dataspace-manager-docker-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hoelk-f"
      - name: Read Manager version
        id: manager-version
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Verify embedded package pins
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const packageJson = require("./package.json");
          const packageLock = require("./package-lock.json");
          const dockerfile = fs.readFileSync("Dockerfile", "utf8");
          if (!/^\d+\.\d+\.\d+$/.test(packageJson.version) || packageLock.version !== packageJson.version) {
            throw new Error(
              `Manager version is not a stable, synchronized SemVer: package.json=${packageJson.version}, ` +
              `package-lock.json=${packageLock.version}.`,
            );
          }
          const pins = [
            ["@hoelk-f/solid-data-manager", "SOLID_DATA_MANAGER_PACKAGE_VERSION"],
            ["@hoelk-f/semantic-data-catalog", "SEMANTIC_DATA_CATALOG_PACKAGE_VERSION"],
            ["@hoelk-f/solid-health-app", "SOLID_HEALTH_APP_PACKAGE_VERSION"],
            ["@hoelk-f/city-tours", "CITY_TOURS_PACKAGE_VERSION"],
            ["@hoelk-f/solid-health-questionnaire", "SOLID_HEALTH_QUESTIONNAIRE_PACKAGE_VERSION"],
          ];

          for (const [packageName, argumentName] of pins) {
            const match = dockerfile.match(new RegExp(`^ARG ${argumentName}=([^\\s]+)$`, "m"));
            if (!match) {
              throw new Error(`Dockerfile does not define ${argumentName}.`);
            }

            const dockerVersion = match[1];
            const requestedVersion = packageJson.dependencies?.[packageName];
            const lockRequest = packageLock.packages?.[""]?.dependencies?.[packageName];
            const lockedVersion = packageLock.packages?.[`node_modules/${packageName}`]?.version;

            if (requestedVersion !== dockerVersion || lockRequest !== dockerVersion || lockedVersion !== dockerVersion) {
              throw new Error(
                `${packageName} is not pinned consistently: Dockerfile=${dockerVersion}, ` +
                `package.json=${requestedVersion}, package-lock request=${lockRequest}, ` +
                `package-lock package=${lockedVersion}.`,
              );
            }
          }
          NODE
      - name: Test Admin authentication and API
        run: |
          npm ci --prefix admin-service --ignore-scripts --no-audit --no-fund
          npm test --prefix admin-service
      - name: Verify GitHub Packages authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry https://npm.pkg.github.com
      - name: Wait for pinned embed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            all_available=true

            while IFS='|' read -r package_name package_version; do
              published_version=$(npm view "${package_name}@${package_version}" version --registry https://npm.pkg.github.com 2>/dev/null || true)
              if [ "$published_version" != "$package_version" ]; then
                echo "Waiting for ${package_name}@${package_version} (attempt ${attempt}/60)."
                all_available=false
              fi
            done < <(node -e "const p = require('./package.json').dependencies; for (const name of ['@hoelk-f/solid-data-manager', '@hoelk-f/semantic-data-catalog', '@hoelk-f/solid-health-app', '@hoelk-f/city-tours', '@hoelk-f/solid-health-questionnaire']) console.log(name + '|' + p[name]);")

            if [ "$all_available" = true ]; then
              exit 0
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "At least one pinned embed package did not become available in time." >&2
              exit 1
            fi

            sleep 10
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            son1i/solid-dataspace-manager:sha-${{ github.sha }}
            son1i/solid-dataspace-manager:latest
            son1i/solid-dataspace-manager:${{ steps.manager-version.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}

      - name: Publish Admin API
        uses: docker/build-push-action@v6
        with:
          context: ./admin-service
          file: ./admin-service/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            son1i/solid-dataspace-admin-api:sha-${{ github.sha }}
            son1i/solid-dataspace-admin-api:${{ steps.manager-version.outputs.version }}
      - name: Publish Admin controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./admin-service/Dockerfile.controller
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            son1i/solid-dataspace-admin-controller:sha-${{ github.sha }}
            son1i/solid-dataspace-admin-controller:${{ steps.manager-version.outputs.version }}
